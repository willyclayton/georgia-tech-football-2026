name: Saturday season sync

on:
  schedule:
    # Saturday 12:00 UTC (8:00 ET during EDT) — before kickoffs
    - cron: '0 16 * * 6'
    # Sunday 08:00 UTC (4:00 ET) — pick up Saturday night finals
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run sync
      - name: Commit refreshed slate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/ask-knowledge.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore: refresh 2026 ESPN slate"
          git push
